# Break to Escape is a Unity (C#) Android game; Unity cannot run in this sandbox.
# This stack serves the repository's README, docs and source as a rendered
# Markdown/file browser so the project can be previewed in Alloy.
services:
  docs:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    volumes:
      - .:/workspace
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
    command: bash -lc "npx --yes markserv@1.17.4 /workspace --address 0.0.0.0 --port 3000 --livereloadport 35729 --browser false --silent false"
    restart: unless-stopped
